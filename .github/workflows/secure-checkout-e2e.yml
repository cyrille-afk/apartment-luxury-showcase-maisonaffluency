name: Secure Checkout E2E Automated Validation Matrix
on: [push, pull_request]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install --frozen-lockfile

      # CRITICAL STEP: Download the designated browser engines for Playwright
      - name: Install Playwright Target Engine Binaries
        run: bunx playwright install --with-deps chromium webkit

      - name: Build Production Bundle
        run: bun run build

      - name: Execute Latency Persistence Matrix Tests
        run: bunx playwright test e2e/cart-multi-browser-persistence.spec.ts --project=desktop-chrome --project=cart-webkit

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
