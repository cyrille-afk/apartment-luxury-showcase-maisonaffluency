name: Secure Checkout E2E Automated Validation Matrix
on: [push, pull_request]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: npm ci

      # CRITICAL STEP: Download the designated browser engines for Playwright
      - name: Install Playwright Target Engine Binaries
        run: npx playwright install --with-deps chromium webkit

      - name: Build Production Bundle
        run: npm run build

      - name: Execute Latency Persistence Matrix Tests
        run: npx playwright test e2e/cart-multi-browser-persistence.spec.ts --project=desktop-chrome --project=cart-webkit

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
