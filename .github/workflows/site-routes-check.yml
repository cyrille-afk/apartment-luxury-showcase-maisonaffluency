name: Published site routes

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  site-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ./scripts/verify-site-routes.ts https://www.maisonaffluency.com
