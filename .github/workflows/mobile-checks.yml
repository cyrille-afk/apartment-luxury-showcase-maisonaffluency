name: Mobile PWA & a11y checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vitest-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guards PDF/quote business logic — including the 100%-upfront flip when
    # stock_status_override or lead_weeks_max_override changes (see
    # src/lib/__tests__/computeDepositPct.test.ts).
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run vitest unit suite
        run: bunx vitest run

  playwright-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun and Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: mobile-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: mobile-playwright-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Ensure Chromium is installed
        run: bunx playwright install --with-deps chromium
      - name: Run mobile Playwright checks
        shell: bash
        run: |
          set -o pipefail
          bun run test:e2e:mobile-pwa 2>&1 | tee playwright-mobile.log
        timeout-minutes: 10
        env:
          # Verbose Playwright API logs surface in the GH Action output, making
          # CDP-disconnect / timeout failures debuggable without re-running locally.
          DEBUG: pw:api
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            playwright-mobile.log
          retention-days: 14
          if-no-files-found: ignore

  playwright-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    # Visual regression for landing CTAs / hero / designers section across mobile + desktop.
    # Baselines live under e2e/visual/__screenshots__/. Refresh locally with `bun run test:visual:update`.
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun and Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: visual-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: visual-playwright-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Ensure Chromium is installed
        run: bunx playwright install --with-deps chromium
      - name: Run visual structural checks (informational)
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:visual -- --grep-invert '@pixel' 2>&1 | tee playwright-visual-structural.log
        timeout-minutes: 10
      - name: Run pixel snapshot checks (informational)
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:visual -- --grep '@pixel' 2>&1 | tee playwright-visual-pixel.log
        timeout-minutes: 10
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-visual-report
          path: |
            playwright-report
            test-results
            playwright-visual-structural.log
            playwright-visual-pixel.log
          retention-days: 14
          if-no-files-found: ignore

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Blocking mobile performance gate: 1 Lighthouse run on "/" under
    # simulated mobile 4G. Fails the build when FCP / LCP / CLS / TBT or the
    # performance / accessibility scores breach the budgets in
    # scripts/lighthouse-mobile.mjs. Scope is deliberately narrow — the previous
    # 2-route × 3-run matrix overran the 35-minute step budget on shared runners.
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run mobile Lighthouse routes (blocking)
        shell: bash
        run: |
          set -o pipefail
          ROUTES="/" \
          LH_RUNS=1 \
          LH_THROTTLING=simulate \
          LH_AUDIT_TIMEOUT_MS=120000 \
          LH_BUILD_TIMEOUT_MS=420000 \
          LH_TOTAL_TIMEOUT_MS=780000 \
          bun run lighthouse:mobile 2>&1 | tee lighthouse-mobile.log
        timeout-minutes: 15
      - name: Summarise Core Web Vitals
        if: always()
        shell: bash
        run: |
          {
            echo "### Lighthouse mobile"
            echo '```'
            grep -E '^(▸|  [✓✗])' lighthouse-mobile.log || echo "no metrics captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-report
          path: |
            lighthouse-report
            lighthouse-mobile.log
          retention-days: 14
          if-no-files-found: ignore
