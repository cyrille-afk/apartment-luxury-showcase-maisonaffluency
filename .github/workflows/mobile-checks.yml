name: Mobile PWA & a11y checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Manual npm cache — actions/setup-node's cache doesn't apply inside a container job.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run test:e2e:mobile-pwa
        timeout-minutes: 10
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Decoupled from playwright-mobile so a flaky e2e run doesn't mask
    # the real Lighthouse signal. Both jobs report independently.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ROUTES="/, /trade/login" npm run lighthouse:mobile
        timeout-minutes: 20
      - name: Upload Lighthouse report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
          if-no-files-found: ignore
