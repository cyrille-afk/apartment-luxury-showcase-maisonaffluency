name: Mobile PWA & a11y checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playwright-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - run: npm run test:e2e:mobile-pwa

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: playwright-mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ROUTES="/, /trade/login" npm run lighthouse:mobile
