name: Mobile PWA & a11y checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:mobile-pwa

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: playwright-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ROUTES="/, /trade/login" npm run lighthouse:mobile
