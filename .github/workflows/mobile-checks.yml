name: Mobile PWA & a11y checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Manual npm cache — actions/setup-node's cache doesn't apply inside a container job.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: mobile-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mobile-playwright-${{ runner.os }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Ensure Chromium is installed
        run: npx playwright install chromium
      - run: npm run test:e2e:mobile-pwa
        timeout-minutes: 10
        env:
          # Verbose Playwright API logs surface in the GH Action output, making
          # CDP-disconnect / timeout failures debuggable without re-running locally.
          DEBUG: pw:api
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Decoupled from playwright-mobile so a flaky e2e run doesn't mask
    # the real Lighthouse signal. Both jobs report independently.
    # `continue-on-error` on the audit step keeps the pipeline green when
    # Lighthouse silently hangs — the report is still uploaded for inspection.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mobile Lighthouse routes
        run: ROUTES="/,/trade/login" LH_AUDIT_TIMEOUT_MS=180000 npm run lighthouse:mobile
        timeout-minutes: 40
      - name: Upload Lighthouse report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
          if-no-files-found: ignore
