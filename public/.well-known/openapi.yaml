openapi: 3.0.1
info:
  title: Maison Affluency Trade Panel API
  description: >
    Trade portal extension API for Maison Affluency. Returns the member's active
    project folders and stages catalogue products into a chosen project workflow
    through a verified data handshake against the main dashboard database.
  version: 1.0.0
servers:
  - url: https://dcrauiygaezoduwdjmsm.supabase.co/functions/v1
paths:
  /extension-sync-projects:
    get:
      operationId: get_synced_projects
      summary: Returns the member's active project folders synced with the extension.
      description: >
        Call this before staging any product so the targetWorkflow name matches an
        existing folder.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of active project folders to return. Defaults to all active folders.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Active project folders.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    projectId:
                      type: string
                      description: Stable UUID of the project workflow in the portal database.
                    name:
                      type: string
                      description: Display name of the project folder, e.g. 'Singapore GCB workflow'.
                    synced:
                      type: boolean
                      description: True when the folder shares real-time data hooks with the extension.
                  required: [projectId, name, synced]
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token does not grant trade portal access.
  /extension-stage-product:
    post:
      operationId: stage_product_to_project
      summary: Stages a catalogue product into one of the member's active project workflows.
      description: >
        Executes the verified data handshake back to the main dashboard database.
        Call get_synced_projects first to resolve a valid targetWorkflow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  description: Stable UUID of the trade catalogue product to stage.
                productName:
                  type: string
                  description: Display name of the product exactly as shown in the catalogue, e.g. 'Casque Bar Cabinet'.
                targetWorkflow:
                  type: string
                  description: Exact name of the destination project folder, e.g. 'Singapore GCB workflow' or 'Hamptons Project'.
              required: [productId, productName, targetWorkflow]
      responses:
        "200":
          description: Result of the staging handshake.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [staged, rejected]
                    description: staged when the record was written and verified, rejected when validation failed.
                  boardItemId:
                    type: string
                    description: UUID of the created board item record, present when status is 'staged'.
                  targetWorkflow:
                    type: string
                    description: Name of the project folder the product was staged into.
                  verifiedAt:
                    type: string
                    description: ISO 8601 timestamp of server-side verification.
                  message:
                    type: string
                    description: Human-readable result, e.g. Success - Casque Bar Cabinet added to Singapore GCB workflow.
                required: [status, targetWorkflow, message]
        "401":
          description: Missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase access token of the signed-in trade portal member.
